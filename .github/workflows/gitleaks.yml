name: Scan Secrets

on: [push]

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (FULL history)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # 👈 IMPORTANTE

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --verbose --no-git
